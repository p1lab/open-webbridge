<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OpenWebBridge</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      background-color: #f9fafb;
      color: #1f2937;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #ef4444;
    }
    .badge.connected {
      background-color: #10b981;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #4b5563;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      outline: none;
    }
    input:focus {
      border-color: #2563eb;
    }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      background-color: #2563eb;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    button.secondary {
      background-color: #e5e7eb;
      color: #374151;
    }
    button.secondary:hover {
      background-color: #d1d5db;
    }
    .status-box {
      margin-top: 14px;
      padding: 10px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-size: 12px;
    }
    .status-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .status-item:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <h2>
    <span id="status-badge" class="badge"></span>
    OpenWebBridge
  </h2>

  <div class="form-group">
    <label for="ws-url">Daemon WebSocket URL</label>
    <input type="text" id="ws-url" value="ws://127.0.0.1:10087/ws">
  </div>

  <div class="btn-row">
    <button id="save-btn">保存并重连</button>
  </div>

  <div class="status-box">
    <div class="status-item">
      <span>连接状态:</span>
      <strong id="status-text">未连接</strong>
    </div>
    <div class="status-item">
      <span>插件版本:</span>
      <span id="version-text">1.0.0</span>
    </div>
    <div class="status-item">
      <span>活跃会话:</span>
      <span id="session-count">0</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
